name: lakehouse-dagster

x-dagster-common: &dagster-common
  build:
    context: .
    dockerfile: infra/dagster/Dockerfile
  image: lakehouse-dagster:1.13.22
  restart: unless-stopped
  environment: &dagster-environment
    DAGSTER_HOME: /opt/dagster/dagster_home
    DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:?}
    DAGSTER_PG_DB: ${DAGSTER_PG_DB:?}
    DAGSTER_PG_USER: ${DAGSTER_PG_USER:?}
    DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:?}
    STAGING_PATH: /opt/dagster/data/staging
    SALESFORCE_USERNAME: ${SALESFORCE_USERNAME:-}
    SALESFORCE_PASSWORD: ${SALESFORCE_PASSWORD:-}
    SALESFORCE_SECURITY_TOKEN: ${SALESFORCE_SECURITY_TOKEN:-}
    SALESFORCE_DOMAIN: ${SALESFORCE_DOMAIN:-login}
  volumes:
    - dagster_storage:/opt/dagster/storage
  depends_on:
    database-init:
      condition: service_completed_successfully

services:
  database-init:
    image: postgres:17-alpine
    environment:
      PGHOST: ${DAGSTER_PG_HOST:?}
      PGPORT: ${DAGSTER_PG_PORT:-5432}
      PGDATABASE: ${DAGSTER_PG_DB:?}
      PGUSER: ${DAGSTER_PG_USER:?}
      PGPASSWORD: ${DAGSTER_PG_PASSWORD:?}
    command:
      - psql
      - --set
      - ON_ERROR_STOP=1
      - --file
      - /init/001_schemas.sql
    volumes:
      - ./infra/postgres/init/001_schemas.sql:/init/001_schemas.sql:ro

  dagster-code:
    <<: *dagster-common
    command:
      - dagster
      - code-server
      - start
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --module-name
      - lakehouse_pipeline
    expose:
      - "4000"
    volumes:
      - dagster_storage:/opt/dagster/storage
      - staging_data:/opt/dagster/data/staging
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "--port", "4000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dagster-webserver:
    <<: *dagster-common
    command:
      - dagster-webserver
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --workspace
      - /opt/dagster/dagster_home/workspace.yaml
    expose:
      - "3000"
    depends_on:
      database-init:
        condition: service_completed_successfully
      dagster-code:
        condition: service_healthy

  dagster-gateway:
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
    image: lakehouse-dagster-gateway:1.0
    restart: unless-stopped
    environment:
      DAGSTER_BASIC_AUTH_USERNAME: ${DAGSTER_BASIC_AUTH_USERNAME}
      DAGSTER_BASIC_AUTH_PASSWORD: ${DAGSTER_BASIC_AUTH_PASSWORD}
    expose:
      - "8080"
    depends_on:
      - dagster-webserver
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  dagster-daemon:
    <<: *dagster-common
    command:
      - dagster-daemon
      - run
      - --workspace
      - /opt/dagster/dagster_home/workspace.yaml
    depends_on:
      database-init:
        condition: service_completed_successfully
      dagster-code:
        condition: service_healthy

volumes:
  dagster_storage:
  staging_data:
